services:
  - type: web
    name: elyazisi-api
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://fontify.online,https://www.fontify.online
      - key: DEFAULT_USER_CREDITS
        value: "10"
      - key: ALLOW_LEGACY_MOBILE_UPLOADS
        value: "false"
      - key: ALLOW_INSECURE_RECAPTCHA
        value: "false"
      - key: RECAPTCHA_REQUIRED
        value: "false"
      - key: MAX_FORM_UPLOAD_SIZE_MB
        value: "25"
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_MODEL_TIMEOUT_MS
        value: "30000"
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: AI_DOCUMENT_PROVIDER_ORDER
        value: groq,gemini,openai,openrouter
      - key: COPILOT_PROVIDER_ORDER
        value: groq,gemini,openai,openrouter
