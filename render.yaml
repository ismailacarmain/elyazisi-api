services:
  - type: web
    name: elyazisi-api
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://fontify.online,https://www.fontify.online
      - key: DEFAULT_USER_CREDITS
        value: "10"
      - key: ALLOW_LEGACY_MOBILE_UPLOADS
        value: "false"
      - key: ALLOW_INSECURE_RECAPTCHA
        value: "false"
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: AI_DOCUMENT_PROVIDER_ORDER
        value: gemini,groq,openrouter
      - key: COPILOT_PROVIDER_ORDER
        value: groq,gemini,openrouter
